services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: ally, POSTGRES_PASSWORD: ally, POSTGRES_DB: ally }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ally"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    volumes: [storage:/app/storage]
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
volumes:
  dbdata:
  storage:

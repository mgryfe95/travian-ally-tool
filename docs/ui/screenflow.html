<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travian Ally Tool – Screenflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15130f; --side:#191612; --surface:#1e1b16; --raised:#26221b; --line:#352f24; --line2:#2a261f;
  --text:#ece6d8; --text2:#cfc6b2; --muted:#a8a08e;
  --accent:#d9a441; --accent-ink:#1a1407; --link:#e0b458; --link-h:#f2cd7e;
  --warn:#f0a27f; --warn-bg:#221a13; --warn-line:#6b4a2f; --info:#8cc4de;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:var(--link);text-decoration:none}a:hover{color:var(--link-h)}
button,input,select,textarea{font:inherit}
.mono{font-family:'IBM Plex Mono',monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Screenflow-Leiste (nicht Teil der App) */
.flowbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;background:#0d0c0a;border-bottom:1px solid #3a3226}
.flowbar .t{font-weight:600;color:var(--link);margin-right:8px;font-size:13px}
.flowbar a{font-size:12px;padding:5px 9px;border-radius:6px;color:var(--text2);border:1px solid transparent}
.flowbar a.cur{border-color:var(--accent);color:var(--link-h)}
.flowbar label{margin-left:auto;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;cursor:pointer}
.ccnote{display:none;border:1px dashed #5fa8c9;background:#13222a;color:#cfe8f3;border-radius:8px;padding:8px 10px;font-size:12.5px;margin:6px 0}
.ccnote b{color:#8cd3f2}
body.notes .ccnote{display:block}

/* App */
.shell{display:flex;flex-wrap:wrap;min-height:calc(100vh - 44px)}
.side{flex:1 1 220px;max-width:260px;background:var(--side);border-right:1px solid #2c271f;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.logo{font-family:'Cinzel',serif;font-size:19px;color:var(--link);padding:4px 12px 2px}
.srv{font-size:12px;color:var(--muted);padding:0 12px 18px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text2);min-height:24px}
.nav:hover{background:var(--raised);color:var(--text)}
.nav.on{background:#2e281d;color:var(--link-h)}
.sep{height:1px;background:#2c271f;margin:12px 0}
.me{margin-top:auto;padding:12px;border-radius:10px;background:#211d17;font-size:13px}
.main{flex:999 1 560px;min-width:0;padding:28px clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.card.flush{padding:8px 8px 4px}
.card.hi{border-color:#5a4c2e}
.card.warn{border-color:var(--warn-line);background:var(--warn-bg)}
h1{margin:2px 0 0;font-size:28px;font-weight:600}
h2{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--link);border:1px solid #5a4c2e}
.field{min-height:40px;width:100%;background:var(--bg);color:var(--text);border:1px solid #403829;border-radius:8px;padding:0 10px}
textarea.field{padding:10px;min-height:auto}
.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:22px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.r{text-align:right}
.stale{color:var(--warn);font-weight:600}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-block}
.p-ok{background:#24402a;color:#bfe6c4}.p-wait{background:#4a3a14;color:#f6d98c}.p-none{background:#2a261f;color:var(--text2);font-weight:400}
.t-dringend{background:#5a2a1f;color:#ffc7b3}.t-angriff{background:#4a3a14;color:#f6d98c}.t-info{background:#1d3a48;color:#b9e1f2}.t-erledigt{background:#24402a;color:#bfe6c4}
.chip{font-size:12px;padding:1px 8px;border-radius:10px;background:#2a261f;color:var(--text2)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.opt{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #403829;background:var(--bg);color:var(--text);cursor:pointer}
.opt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #2c271f}
.tab{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--link-h);font-weight:600;border-bottom-color:var(--accent)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:1.5px dashed #5a4c2e;border-radius:10px;text-align:center;padding:16px;cursor:pointer;background:#1a1712}
.bar{height:8px;border-radius:4px;background:#2a261f;margin-top:5px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px}
.listbtn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:36px;padding:0 10px;margin:1px 0;border:0;border-radius:7px;cursor:pointer;text-align:left;background:transparent;color:var(--text2)}
.listbtn.on{background:#2e281d;color:var(--link-h);font-weight:600}
.badge{font-size:11px;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-align:center}
.sect{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.avatar{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent-ink)}
/* Flow-Übersicht */
.flowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.fcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--text)}
.fcard:hover{border-color:var(--accent);color:var(--text)}
.fcard .n{font-family:'IBM Plex Mono',monospace;color:var(--link);font-size:12px}
.arrow{color:var(--muted);font-size:13px}
/* Auth-Screens */
.center{min-height:calc(100vh - 44px);display:flex;align-items:center;justify-content:center;padding:24px}
.authbox{width:min(100%,440px)}
/* Phone */
.phone{width:390px;max-width:100%;height:844px;margin:24px auto;border:1px solid #3a3226;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);font-size:15px}
</style>
</head>
<body>
<div class="flowbar" id="flowbar"></div>
<div id="app"></div>

<script>
/* ===== Mock-Daten ===== */
const OWN = [
  { id:'nordwacht', name:'Nordwacht', x:-12, y:34, role:'Hauptdorf · Off', pop:742, prod:'1.120 / 1.080 / 1.150 / 640', troops:'vor 3 Tagen', troopsStale:true, res:'heute', resStale:false, build:'heute', buildStale:false },

  { id:'felsgrund', name:'Felsgrund', x:-17, y:29, role:'Versorger', pop:388, prod:'480 / 520 / 470 / 960', troops:'heute', troopsStale:false, res:'heute', resStale:false, build:'vor 6 Tagen', buildStale:true },

  { village:'Mühlbach', x:2, y:40, player:'Sandor', ally:'SUN', tribe:'Ägypter', pop:377, delta:'±0', days:4 },
  { village:'Rabenfels', x:-30, y:37, player:'Ilka', ally:'—', tribe:'Hunnen', pop:155, delta:'±0', days:7 },
  { village:'Kalkgrube', x:-10, y:52, player:'Bertram', ally:'SUN', tribe:'Römer', pop:289, delta:'−4', days:3 },
  { village:'Ostwall', x:6, y:27, player:'Lysandra', ally:'—', tribe:'Spartaner', pop:63, delta:'±0', days:15 },

const ALLY_CHANNELS = ['Deff-Call','Deff-Reports','Off-Call','Off-Reports','Ressources','Settlement','Sitter','Mixed topics'];
const TASKFORCES = [{ name:'TF Südfront', members:6 }, { name:'TF WW-Vorbereitung', members:11 }];
const MESSAGES = [
  { author:'Wendelin', role:'Moderator', time:'10:41', channel:'Deff-Call', tag:'Dringend', text:'Angriff auf Eichenhain in 2:14 h, ca. 3 Wellen. Wer kann Deff schicken nach', coord:'(-8|39)' },
  { author:'Ragna', role:'Member', time:'10:44', channel:'Deff-Call', tag:'', text:'Schicke 800 Phalanx, Ankunft 11:58. Ziel', coord:'(-8|39)', attach:{ type:'image', name:'deff-bericht.png', size:'412 KB' } },
  { author:'Thoralf', role:'Member', time:'10:52', channel:'Off-Call', tag:'Angriff', text:'Hammer aus Nordwacht steht. Fake-Welle auf Ziel', coord:'(-31|18)' },
  { author:'Iven', role:'Admin', time:'11:03', channel:'Ressources', tag:'Info', text:'Brauche 20k Getreide für Party in Sumpfrand, Ziel', coord:'(-21|41)', attach:{ type:'pdf', name:'plan-ww.pdf', size:'1,2 MB' } },
  { author:'Ragna', role:'Member', time:'11:10', channel:'Mixed topics', tag:'', text:'Neue Inaktive nahe Felsgrund, siehe Liste. Startpunkt', coord:'(-25|22)' }

const TF_MESSAGES = [

  { author:'Thoralf', role:'Member', time:'09:40', channel:'', tag:'', text:'Bin dabei, 2 Katawellen ab 22 Uhr auf', coord:'(-20|5)' }
];
const AV = ['#d9a441','#8cc4de','#c99be0','#9fd39a'];

/* ===== Zustand ===== */
const S = { origin:0, chat:'Alle', adminTab:0, gdTab:0, gdBuilding:1, gdTribe:1 };

/* ===== Helfer ===== */
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const note = t => `<div class="ccnote"><b>CC:</b> ${t}</div>`;
const tagPill = t => t ? `<span class="pill t-${t.toLowerCase()}">${t}</span>` : '';
function sideNav(active, user){
  const it = (id,label,href) => `<a class="nav ${active===id?'on':''}" href="#${href||id}">${label}</a>`;
  return `<nav class="side" aria-label="Hauptnavigation">
    <div class="logo">Ally Tool</div><div class="srv">ts12 · Europe · [NEXUS]</div>
    ${it('main','Übersicht')}${it('village','Meine Dörfer')}${it('inactives','Inaktive')}${it('chat','Chat')}${it('tf','Task-Forces','chat')}
    <div class="sep"></div>${it('admin','Admin')}${it('gamedata','Spieldaten')}
    <div class="me"><div style="font-weight:600">${user?user[0]:'Thoralf'}</div><div class="sub">${user?user[1]:'Member · Germanen'}</div></div>
  </nav>`;
}
const shell = (active, inner, user) => `<div class="shell">${sideNav(active,user)}<main class="main">${inner}</main></div>`;

/* ===== Screens ===== */
const SCREENS = [
  { id:'flow', label:'0 · Flow' },
  { id:'login', label:'1 · Login' },
  { id:'invite', label:'2 · Einladung' },
  { id:'claim', label:'3 · Gast-Verifizierung' },
  { id:'main', label:'4 · Übersicht' },
  { id:'village', label:'5 · Dorf-Dashboard' },
  { id:'inactives', label:'6 · Inaktive' },
  { id:'chat', label:'7 · Chat' },
  { id:'chatmobile', label:'8 · Chat Mobile' },
  { id:'admin', label:'9 · Admin' },
  { id:'gamedata', label:'10 · Spieldaten' }
];

function vFlow(){
  const c = (id,n,t,d) => `<a class="fcard" href="#${id}"><div class="n">${n}</div><div style="font-weight:600;font-size:15px;margin:2px 0 4px">${t}</div><div class="sub">${d}</div></a>`;
  return `<div style="max-width:1200px;margin:0 auto;padding:28px clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:22px">
    <header><div class="sub">Travian Ally Tool · Screenflow für Claude Code</div><h1>Screenflow</h1>
    <p class="sub" style="max-width:760px">Alle Screens sind klickbar verbunden. Oben rechts „Hinweise für CC“ einschalten, um Implementierungshinweise je Screen zu sehen. Daten sind Beispieldaten. Maßgeblich für Logik und Datenmodell ist <span class="mono">CC_AUFTRAG_MVP.md</span>.</p></header>

      <div class="flowgrid">${c('login','1','Login','E-Mail + Passwort')}${c('invite','2','Einladung einlösen','Link aus Ingame-Nachricht → Registrierung → automatisch verifiziert (Member)')}${c('claim','3','Gast-Verifizierung','Ohne Einladung: Spieler beanspruchen → Dorf-Code → Prüfung beim nächsten map.sql-Import')}</div>
      <p class="arrow">Login / Einladung / Gast-Verifizierung → Übersicht</p></section>
    <section><h2 style="margin-bottom:10px">B · Meine Dörfer</h2>
      <div class="flowgrid">${c('main','4','Übersicht','Account-KI-Instruktionen, fällige Aktualisierungen, KI-Tipps, Dörferstatistik-Upload, Dorfliste')}${c('village','5','Dorf-Dashboard','Uploads (Versammlungsplatz, Dorfansicht, Ressourcen), Dorf-KI-Instruktionen, Tipps, Ist-Zustand')}${c('inactives','6','Inaktive','Entfernungsmesser ab eigenem Dorf, Filter, Sortierung nach Distanz')}</div>
      <p class="arrow">Übersicht → Hinweis/Dorfliste → Dorf-Dashboard · Übersicht ↔ Inaktive · Dorf-Dashboard → Spieldaten (Kostenquelle)</p></section>
    <section><h2 style="margin-bottom:10px">C · Kommunikation</h2>
      <div class="flowgrid">${c('chat','7','Chat Desktop','Sammelraum „Alle“, 8 Allianz-Kanäle, Task-Forces, Tags, Anhänge mit Vorschau')}${c('chatmobile','8','Chat Mobile','Kanalwahl, Nachrichten, Composer, Tab-Bar')}</div>
      <p class="arrow">Koordinaten in Nachrichten → Inaktive/Karte</p></section>
    <section><h2 style="margin-bottom:10px">D · Verwaltung</h2>
      <div class="flowgrid">${c('admin','9','Admin','Mitglieder & Einladungen, Rechte-Matrix, Kanäle & Tags')}${c('gamedata','10','Spieldaten','Gebäude je Stufe, Truppen je Volk, Völker')}</div>
      <p class="arrow">Admin → „Einladung erzeugen“ → IGM-Text kopieren → (Spieler) → Einladung einlösen</p></section>
  </div>`;
}

function vLogin(){
  return `<div class="center"><div class="authbox card">
    <div class="logo" style="padding:0 0 4px">Ally Tool</div><div class="sub" style="margin-bottom:18px">ts12 · Europe · [NEXUS]</div>
    <h1 style="font-size:22px;margin-bottom:16px">Anmelden</h1>

      <a class="btn" href="#main">Anmelden</a>

function vInvite(){
  return `<div class="center"><div class="authbox card">
    <div class="logo" style="padding:0 0 4px">Ally Tool</div>
    <h1 style="font-size:22px;margin:10px 0 6px">Willkommen, Sigrun</h1>

}

    <h1 style="font-size:22px;margin-bottom:6px">Travian-Spieler verknüpfen</h1>
    <p class="sub" style="margin:0 0 16px">Du bist als Gast angemeldet. Wähle deinen Spieler aus der Allianz und bestätige ihn mit einem Code.</p>

function vMain(){
  const due = [
    ['die Truppen','Nordwacht','3 Tagen','Versammlungsplatz hochladen'],
    ['die Ressourcen','Eichenhain','4 Tagen','Ressourcenfelder hochladen'],
    ['die Dorfansicht','Felsgrund','6 Tagen','Dorfansicht hochladen']
  ].map(d => `<div class="row between" style="padding:10px 12px;border-radius:8px;background:#1b1611">
      <div>Du hast <strong>${d[0]}</strong> von <a href="#village">${d[1]}</a> zuletzt vor <strong class="mono">${d[2]}</strong> aktualisiert.</div>
      <a class="btn ghost sm" href="#village">${d[3]}</a></div>`).join('');
  const rows = OWN.map(v => `<tr>
      <td><a href="#village" style="font-weight:600">${v.name}</a><div class="sub" style="font-size:12px">${v.role}</div></td>
      <td class="mono">(${v.x}|${v.y})</td><td class="mono">${v.pop}</td><td class="mono" style="font-size:13px">${v.prod}</td>
      <td class="${v.troopsStale?'stale':''}">${v.troops}</td><td class="${v.resStale?'stale':''}">${v.res}</td><td class="${v.buildStale?'stale':''}">${v.build}</td>
      <td><a href="#village">Öffnen</a></td></tr>`).join('');
  return shell('main', `
    <header class="row between" style="align-items:flex-end">

function vInactives(){

  const rows = INACTIVE.map(v => ({ ...v, dist: Math.hypot(d(v.x,o.x), d(v.y,o.y)) })).sort((a,b)=>a.dist-b.dist)
    .map(v => { const dec = v.delta.startsWith('−');
      return `<tr><td class="mono" style="color:var(--link-h);font-weight:500">${v.dist.toFixed(1)}</td><td>${v.village}</td><td class="mono">(${v.x}|${v.y})</td><td>${v.player}</td><td style="color:var(--text2)">${v.ally}</td><td style="color:var(--text2)">${v.tribe}</td><td class="mono r">${v.pop}</td><td class="mono r sub">${v.delta}</td>
      <td><span style="font-size:12px;font-weight:600;color:${dec?'var(--warn)':'var(--info)'}">${dec?'schrumpft':'inaktiv'} · ${v.days} T</span></td></tr>`; }).join('');

  return shell('inactives', `

      </div>
      ${note('Ursprung = eigene Dörfer des verifizierten Spielers oder freie Koordinate; letzter Ursprung pro Nutzer gemerkt. Distanz mit Kartenwrap (Legends: Karte −200…200, 401 Felder) als eigene getestete Funktion, später für Laufzeiten wiederverwendbar.')}

      <div class="row between" style="align-items:baseline;margin:12px 12px 8px"><h2 id="res">${INACTIVE.length} Treffer ab ${o.name}</h2><span class="sub" style="font-size:12px">sortiert nach Entfernung · Kartenrand wird umgerechnet</span></div>

  if (!a) return '';
  if (a.type === 'image') return `<button type="button" data-act="lightbox" style="display:block;margin-top:8px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;background:#211d17" aria-label="Bild ${a.name} vergrößern">
      <div style="width:280px;max-width:100%;height:160px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#221e18 0 12px,#1d1a15 12px 24px);color:var(--muted);font-size:12px">[Bildvorschau 480 px]</div>
      <div class="sub" style="font-size:12px;padding:6px 10px;text-align:left">${a.name} · ${a.size}</div></button>`;
  return `<div class="row" style="margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#211d17;max-width:360px">
      <div style="width:48px;height:60px;border-radius:4px;background:#ece6d8;color:#333;font-size:10px;display:flex;align-items:center;justify-content:center">S. 1</div>

}

const VIEWS = { flow:vFlow, login:vLogin, invite:vInvite, claim:vClaim, main:vMain, village:vVillage, inactives:vInactives, chat:vChat, chatmobile:vChatMobile, admin:vAdmin, gamedata:vGameData };

/* ===== Router ===== */
function current(){ const h = (location.hash||'#flow').slice(1); return VIEWS[h] ? h : (['strategie','upload'].includes(h) ? 'main' : 'flow'); }
function render(){
  const cur = current();
  document.getElementById('flowbar').innerHTML = `<span class="t">Screenflow</span>${SCREENS.map(s=>`<a href="#${s.id}" class="${s.id===cur?'cur':''}">${s.label}</a>`).join('')}
    <label><input type="checkbox" id="notesToggle" ${document.body.classList.contains('notes')?'checked':''}> Hinweise für CC</label>`;
  document.getElementById('app').innerHTML = VIEWS[cur]();
  document.title = 'Travian Ally Tool – ' + (SCREENS.find(s=>s.id===cur)||{}).label;
  const h = location.hash.slice(1);
  if (h==='strategie' || h==='upload'){ const el = document.getElementById(h); if (el) el.scrollIntoView(); } else window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
document.addEventListener('change', e => { if (e.target.id==='notesToggle') document.body.classList.toggle('notes', e.target.checked); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, i = Number(b.dataset.i);
  if (a==='origin') S.origin = i;
  else if (a==='chat') S.chat = b.dataset.c;
  else if (a==='admintab') S.adminTab = i;
  else if (a==='gdtab') S.gdTab = i;
  else if (a==='gdb') S.gdBuilding = i;
  else if (a==='gdt') S.gdTribe = i;
  else if (a==='lightbox'){ openLightbox(); return; }
  const y = window.scrollY; render(); window.scrollTo(0,y);
});
function openLightbox(){
  const d = document.createElement('div');
  d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-label','Bildansicht');
  d.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px';
  d.innerHTML = `<div style="width:min(90vw,960px);height:min(70vh,540px);border-radius:10px;background:repeating-linear-gradient(135deg,#221e18 0 16px,#1d1a15 16px 32px);display:flex;align-items:center;justify-content:center;color:#a8a08e">[Bild in Web-Größe, max. 1920 px · Zoom per Mausrad/Pinch]</div>
    <div class="row"><button type="button" class="btn ghost" id="lbPrev">‹ Zurück</button><a class="btn ghost" href="#chat">Download</a><button type="button" class="btn ghost" id="lbNext">Weiter ›</button><button type="button" class="btn" id="lbClose">Schließen</button></div>`;
  document.body.appendChild(d);
  const close = () => { d.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = ev => { if (ev.key==='Escape') close(); };
  d.querySelector('#lbClose').addEventListener('click', close);
  d.addEventListener('click', ev => { if (ev.target===d) close(); });
  document.addEventListener('keydown', onKey);
  d.querySelector('#lbClose').focus();
}
render();
</script>
